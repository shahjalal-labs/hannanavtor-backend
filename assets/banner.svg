<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="1">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4 8"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="4 8"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8"/>
  </g>

  <!-- Accent Glow -->
  <circle cx="1050" cy="120" r="140" fill="#4F46E5" opacity="0.12" filter="blur(60px)"/>
  <circle cx="150" cy="320" r="120" fill="#818CF8" opacity="0.10" filter="blur(50px)"/>

  <!-- Decorative Badge Pill -->
  <g transform="translate(80, 80)">
    <rect width="360" height="36" rx="18" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-opacity="0.35"/>
    <circle cx="18" cy="18" r="5" fill="#818CF8"/>
    <text x="32" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXPRESS • PRISMA • AGORA RTC • STRIPE PAYOUTS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Hannan Avtor Backend
  </text>

  <!-- Subtitle -->
  <text x="80" y="225" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">
    Professional Social Network & Calling API
  </text>

  <!-- Description line -->
  <text x="80" y="275" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Community Networking, Referral Programs, Agora Video/Audio Calling & Creator Payouts
  </text>

  <!-- Bottom Brand -->
  <text x="80" y="345" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    shahjalal-labs • Production Architecture Showcase
  </text>
</svg>
